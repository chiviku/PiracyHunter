    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0B1325" />

    <meta property="og:title" content="Piracy Hunter — Search Intelligence for Content Protection" />

    <style>
      .result-followup {
        max-width: 72rem;
        margin: 0 auto 1.5rem;
        padding: 0 1rem;
        color: #5C6B73;
        font: 0.8125rem/1.5 system-ui, sans-serif;
      }

      .result-followup details {
        border: 1px solid #303B55;
        border-radius: 0.375rem;
        background: #1C2541;
      }

      .result-followup summary {
        padding: 0.65rem 0.8rem;
        color: #CBD5E1;
        cursor: pointer;
        font-weight: 600;
      }

      .result-followup ol {
        display: grid;
        gap: 0.6rem;
        margin: 0;
        padding: 0 1rem 0.85rem 2.2rem;
      }

      .result-followup li {
        padding-left: 0.15rem;
      }

      .result-followup strong {
        color: #FFFFFF;
        font-weight: 600;
      }

      @media (min-width: 640px) {
        .result-followup {
          padding-right: 1.5rem;
          padding-left: 1.5rem;
        }
      }
